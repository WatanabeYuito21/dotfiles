name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (セットアップスクリプト)
        run: |
          shellcheck -x -P SCRIPTDIR -S style \
            setup.sh scripts/setup.sh scripts/lib/*.sh scripts/installers/*.sh \
            scripts/post-install/*.sh wsl/apply-wsl-config.sh
      - name: shellcheck (bash 設定)
        # SC1090: 動的 source / SC2155: 外部ツールが追記した関数
        run: shellcheck -s bash -S warning -e SC1090,SC2155 bash/bashrc bash/conf.d/*.sh

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 依存コマンド (nvim) をインストール
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: setup.sh --dry-run
        run: ./setup.sh --dry-run
